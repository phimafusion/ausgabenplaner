version: '3.8'

services:
  ausgabenplaner:
    # Offizielles Image von GitHub Container Registry (Multi-Arch: amd64 & arm64)
    image: ghcr.io/phimafusion/ausgabenplaner:latest
    # Für lokalen Build stattdessen einkommentieren:
    # build: .
    container_name: ausgabenplaner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/ausgabenplaner.db
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=change-this-secret-key-in-production
      - TZ=Europe/Berlin
      - APP_TIMEZONE=Europe/Berlin
    volumes:
      - ./data:/app/data
